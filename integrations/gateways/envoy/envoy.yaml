static_resources:
  listeners:
  - name: ztna_ingress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ztna_ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: upstream_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: upstream_app_cluster
          http_filters:
          # --- VajraNetra Zero Trust ext_authz HTTP filter ---
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              http_service:
                server_uri:
                  uri: http://vajranetra-backend:8000/api/gateways/envoy/ext_authz
                  cluster: vajranetra_auth_cluster
                  timeout: 1.0s
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: cookie
                    - exact: authorization
                    - exact: x-forwarded-for
                    - exact: user-agent
                    - prefix: x-ztna-
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - prefix: x-forwarded-
                    - prefix: x-ztna-
                    - prefix: x-gateway-
                  allowed_client_headers:
                    patterns:
                    - exact: set-cookie
                    - prefix: x-ztna-
              failure_mode_allow: false
              transport_api_version: V3
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: upstream_app_cluster
    connect_timeout: 0.5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: upstream_app_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: upstream-app
                port_value: 3000

  - name: vajranetra_auth_cluster
    connect_timeout: 0.5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: vajranetra_auth_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: vajranetra-backend
                port_value: 8000
