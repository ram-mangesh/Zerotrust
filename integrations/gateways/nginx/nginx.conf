events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream upstream_backend {
        server 127.0.0.1:3000;
    }

    upstream vajranetra_pdp {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # --- VajraNetra Zero Trust Auth Request Subrequest ---
        location = /_ztna_auth {
            internal;
            proxy_pass http://vajranetra_pdp/api/gateways/nginx/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # --- Protected Upstream Application ---
        location / {
            auth_request /_ztna_auth;

            # Capture verified identity headers from ZTNA subrequest
            auth_request_set $ztna_user $upstream_http_x_forwarded_user;
            auth_request_set $ztna_email $upstream_http_x_forwarded_email;
            auth_request_set $ztna_role $upstream_http_x_forwarded_role;
            auth_request_set $ztna_trust $upstream_http_x_ztna_trust_score;
            auth_request_set $ztna_sig $upstream_http_x_gateway_signature;
            auth_request_set $ztna_ts $upstream_http_x_gateway_timestamp;

            # Forward verified headers to upstream
            proxy_set_header X-Forwarded-User $ztna_user;
            proxy_set_header X-Forwarded-Email $ztna_email;
            proxy_set_header X-Forwarded-Role $ztna_role;
            proxy_set_header X-ZTNA-Trust-Score $ztna_trust;
            proxy_set_header X-Gateway-Signature $ztna_sig;
            proxy_set_header X-Gateway-Timestamp $ztna_ts;

            # Forward to upstream application
            proxy_pass http://upstream_backend;
        }

        # Error page for unauthenticated requests
        error_page 401 = @ztna_login_redirect;
        location @ztna_login_redirect {
            return 302 http://localhost:8000/__ztna/login?return_to=$request_uri;
        }
    }
}
