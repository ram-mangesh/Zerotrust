apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vajranetra.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "vajranetra.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}
  PEP_GATEWAY_SECRET: {{ .Values.secrets.pepGatewaySecret | b64enc | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
